<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Media Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG — edit these three lines for your repo, then push.
     ============================================================ */
</style>
<script>
  const CONFIG = {
    OWNER: "sarvar975853-sketch",   // <-- change this
    REPO: "mediaplayer",          // <-- change this
    BRANCH: "main",                  // <-- change if your default branch differs
    ROOT: "media",                   // <-- folder in the repo where files live
    SITE_TITLE: "MEDIA VAULT",
  };
</script>
<style>
  :root{
    --bg: #0f1113;
    --panel: #16191c;
    --panel-2: #1c1f23;
    --border: #2a2e33;
    --text: #e9e6df;
    --muted: #8b8f94;
    --accent: #e0a83f;
    --accent-dim: #6b5527;
    --teal: #3fa6a0;
    --danger: #c76b5a;
    --radius: 6px;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    gap:14px;
    padding:18px 24px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, var(--panel), var(--bg));
  }
  .reel{
    width:30px;height:30px;flex:none;
  }
  .reel svg{width:100%;height:100%;display:block;}
  .reel.spinning svg{animation: spin 2.2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  header h1{
    font-family:var(--display);
    font-weight:700;
    font-size:19px;
    letter-spacing:0.14em;
    margin:0;
    color:var(--text);
  }
  header .sub{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    margin-left:auto;
  }

  /* ---------- layout ---------- */
  .layout{
    display:flex;
    flex:1;
    min-height:0;
  }
  aside{
    width:250px;
    flex:none;
    border-right:1px solid var(--border);
    background:var(--panel);
    overflow-y:auto;
    padding:14px 0;
  }
  main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
  }
  @media (max-width: 780px){
    .layout{flex-direction:column;}
    aside{width:100%; max-height:220px; border-right:none; border-bottom:1px solid var(--border);}
  }

  /* ---------- folder tree ---------- */
  .tree-label{
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    padding:0 16px 8px;
  }
  .tree-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 16px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--text);
    border-left:2px solid transparent;
    user-select:none;
  }
  .tree-item:hover{background:var(--panel-2);}
  .tree-item.active{
    background:var(--panel-2);
    border-left-color:var(--accent);
    color:var(--accent);
  }
  .tree-item .chev{
    width:10px;height:10px;flex:none;
    transition:transform .15s ease;
    opacity:0.6;
  }
  .tree-item.open .chev{transform:rotate(90deg);}
  .tree-children{
    display:none;
  }
  .tree-children.open{display:block;}
  .tree-children .tree-item{padding-left:32px;}
  .tree-children .tree-children .tree-item{padding-left:48px;}

  /* ---------- player ---------- */
  .player-bar{
    border-bottom:1px solid var(--border);
    padding:18px 24px;
    background:var(--panel);
  }
  .now-playing{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .now-playing .title{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .now-playing .title.active{color:var(--text);}
  video, audio{
    width:100%;
    display:block;
    border-radius:var(--radius);
    background:#000;
    max-height:52vh;
  }
  audio{max-height:none; background:transparent;}
  .empty-player{
    color:var(--muted);
    font-family:var(--mono);
    font-size:13px;
    padding:28px 0;
    text-align:center;
    border:1px dashed var(--border);
    border-radius:var(--radius);
  }
  .mkv-warning{
    margin-top:8px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--danger);
  }

  /* ---------- breadcrumb + file list ---------- */
  .content-area{padding:20px 24px 40px;}
  .breadcrumb{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    margin-bottom:16px;
    display:flex;
    flex-wrap:wrap;
    gap:4px;
  }
  .breadcrumb span{cursor:pointer;}
  .breadcrumb span:hover{color:var(--accent);}
  .breadcrumb .sep{cursor:default; opacity:0.5;}
  .breadcrumb .sep:hover{color:var(--muted);}

  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    margin-bottom:6px;
    background:var(--panel);
    cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
  }
  .file-row:hover{border-color:var(--accent-dim); background:var(--panel-2);}
  .file-row.selected{border-color:var(--accent);}
  .file-row .icon{width:18px;height:18px;flex:none; color:var(--muted);}
  .file-row.folder .icon{color:var(--teal);}
  .file-row .name{
    flex:1;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
  }
  .file-row .meta{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    flex:none;
  }
  .file-row .tag{
    font-family:var(--mono);
    font-size:10px;
    padding:2px 6px;
    border-radius:3px;
    border:1px solid var(--border);
    color:var(--muted);
    flex:none;
  }
  .file-row .dl{
    color:var(--muted);
    flex:none;
    width:16px;height:16px;
  }
  .file-row .dl:hover{color:var(--accent);}

  .status{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--muted);
    padding:20px 0;
  }
  .status.err{color:var(--danger);}
  footer{
    padding:14px 24px;
    border-top:1px solid var(--border);
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--muted);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <div class="reel" id="reel">
    <svg viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="14" stroke="var(--accent)" stroke-width="2"/>
      <circle cx="16" cy="16" r="3" fill="var(--accent)"/>
      <circle cx="16" cy="7" r="2.4" fill="var(--accent)"/>
      <circle cx="24" cy="19.5" r="2.4" fill="var(--accent)"/>
      <circle cx="8" cy="19.5" r="2.4" fill="var(--accent)"/>
    </svg>
  </div>
  <h1 id="site-title">MEDIA VAULT</h1>
  <div class="sub" id="repo-sub"></div>
</header>

<div class="layout">
  <aside>
    <div class="tree-label">Folders</div>
    <div id="tree"></div>
  </aside>

  <main>
    <div class="player-bar">
      <div class="now-playing">
        <div class="reel" id="reel-small" style="width:20px;height:20px;">
          <svg viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="14" stroke="var(--teal)" stroke-width="2"/>
            <circle cx="16" cy="16" r="3" fill="var(--teal)"/>
            <circle cx="16" cy="7" r="2.4" fill="var(--teal)"/>
            <circle cx="24" cy="19.5" r="2.4" fill="var(--teal)"/>
            <circle cx="8" cy="19.5" r="2.4" fill="var(--teal)"/>
          </svg>
        </div>
        <div class="title" id="now-title">nothing selected</div>
      </div>
      <div id="player-slot">
        <div class="empty-player">select a file below to play it</div>
      </div>
    </div>

    <div class="content-area">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="file-list"></div>
    </div>
  </main>
</div>

<footer>served straight from the repo · files are added by pushing to the "<span id="root-name"></span>" folder</footer>

<script>
(function(){
  document.getElementById("site-title").textContent = CONFIG.SITE_TITLE;
  document.getElementById("repo-sub").textContent = CONFIG.OWNER + "/" + CONFIG.REPO;
  document.getElementById("root-name").textContent = CONFIG.ROOT;

  const VIDEO_EXT = ["mp4","webm","ogv"];
  const AUDIO_EXT = ["mp3","wav","m4a","ogg","flac","aac"];
  const MOV_EXT = ["mov"];     // usually h264, often plays, sometimes not
  const MKV_EXT = ["mkv"];     // unreliable browser support

  const cache = new Map(); // path -> items
  let currentPath = CONFIG.ROOT;
  const spool = document.getElementById("reel");
  const spoolSmall = document.getElementById("reel-small");

  function extOf(name){
    const m = name.match(/\.([a-z0-9]+)$/i);
    return m ? m[1].toLowerCase() : "";
  }
  function kindOf(name){
    const e = extOf(name);
    if (VIDEO_EXT.includes(e)) return "video";
    if (AUDIO_EXT.includes(e)) return "audio";
    if (MOV_EXT.includes(e)) return "video-risky";
    if (MKV_EXT.includes(e)) return "video-risky";
    return "other";
  }
  function humanSize(bytes){
    if (bytes == null) return "";
    const units = ["B","KB","MB","GB"];
    let i = 0, n = bytes;
    while (n >= 1024 && i < units.length-1){ n/=1024; i++; }
    return n.toFixed(n < 10 && i>0 ? 1 : 0) + " " + units[i];
  }

  async function apiGet(path){
    if (cache.has(path)) return cache.get(path);
    const url = `https://api.github.com/repos/${CONFIG.OWNER}/${CONFIG.REPO}/contents/${encodeURI(path)}?ref=${CONFIG.BRANCH}`;
    const res = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
    if (!res.ok){
      if (res.status === 403) throw new Error("RATE_LIMIT");
      if (res.status === 404) throw new Error("NOT_FOUND");
      throw new Error("HTTP_" + res.status);
    }
    const data = await res.json();
    const items = Array.isArray(data) ? data : [];
    items.sort((a,b) => {
      if (a.type !== b.type) return a.type === "dir" ? -1 : 1;
      return a.name.localeCompare(b.name);
    });
    cache.set(path, items);
    return items;
  }

  // ---------- folder tree (sidebar) ----------
  const treeRoot = document.getElementById("tree");

  async function buildTreeItem(path, depth, container){
    const label = path === CONFIG.ROOT ? CONFIG.ROOT : path.split("/").pop();
    const row = document.createElement("div");
    row.className = "tree-item";
    row.dataset.path = path;
    row.innerHTML = `
      <svg class="chev" viewBox="0 0 10 10"><path d="M2 1 L7 5 L2 9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
      <span>${label}</span>`;
    container.appendChild(row);

    const childWrap = document.createElement("div");
    childWrap.className = "tree-children";
    container.appendChild(childWrap);

    let loaded = false;

    row.addEventListener("click", async () => {
      document.querySelectorAll(".tree-item.active").forEach(el => el.classList.remove("active"));
      row.classList.add("active");
      openFolder(path);

      const isOpen = row.classList.toggle("open");
      childWrap.classList.toggle("open", isOpen);
      if (isOpen && !loaded){
        loaded = true;
        try{
          const items = await apiGet(path);
          const folders = items.filter(i => i.type === "dir");
          for (const f of folders){
            await buildTreeItem(f.path, depth+1, childWrap);
          }
        }catch(e){
          const errEl = document.createElement("div");
          errEl.className = "status err";
          errEl.style.paddingLeft = "32px";
          errEl.textContent = friendlyError(e);
          childWrap.appendChild(errEl);
        }
      }
    });
  }

  function friendlyError(e){
    if (e.message === "RATE_LIMIT") return "GitHub's public API rate limit was hit — wait a bit and retry.";
    if (e.message === "NOT_FOUND") return "Folder not found. Check ROOT in the config, or that it's been pushed yet.";
    return "Couldn't load this folder (" + e.message + ").";
  }

  // ---------- breadcrumb + file list (main) ----------
  const breadcrumbEl = document.getElementById("breadcrumb");
  const fileListEl = document.getElementById("file-list");

  function renderBreadcrumb(path){
    const parts = path.split("/");
    breadcrumbEl.innerHTML = "";
    let acc = "";
    parts.forEach((part, i) => {
      acc = acc ? acc + "/" + part : part;
      const span = document.createElement("span");
      span.textContent = part;
      span.addEventListener("click", () => openFolder(acc));
      breadcrumbEl.appendChild(span);
      if (i < parts.length - 1){
        const sep = document.createElement("span");
        sep.className = "sep";
        sep.textContent = " / ";
        breadcrumbEl.appendChild(sep);
      }
    });
  }

  function iconFor(type, name){
    if (type === "dir"){
      return `<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M3 6a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6Z" stroke="currentColor" stroke-width="1.6"/></svg>`;
    }
    const k = kindOf(name);
    if (k === "audio"){
      return `<svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M9 18V5l11-2v13" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6"/><circle cx="17" cy="16" r="3" stroke="currentColor" stroke-width="1.6"/></svg>`;
    }
    return `<svg class="icon" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M10 9l6 3-6 3V9Z" fill="currentColor"/></svg>`;
  }

  async function openFolder(path){
    currentPath = path;
    renderBreadcrumb(path);
    fileListEl.innerHTML = `<div class="status">loading…</div>`;
    try{
      const items = await apiGet(path);
      fileListEl.innerHTML = "";
      if (items.length === 0){
        fileListEl.innerHTML = `<div class="status">this folder is empty</div>`;
        return;
      }
      items.forEach(item => {
        const row = document.createElement("div");
        row.className = "file-row" + (item.type === "dir" ? " folder" : "");
        const k = item.type === "file" ? kindOf(item.name) : null;
        const tag = k === "video-risky" ? `<span class="tag">check codec</span>` : "";
        row.innerHTML = `
          ${iconFor(item.type, item.name)}
          <span class="name">${item.name}</span>
          ${tag}
          <span class="meta">${item.type === "file" ? humanSize(item.size) : ""}</span>
          ${item.type === "file" ? `<a class="dl" href="${item.download_url}" download title="download" onclick="event.stopPropagation()"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 20h16" stroke="currentColor" stroke-width="1.6"/></svg></a>` : ""}
        `;
        row.addEventListener("click", () => {
          if (item.type === "dir"){
            openFolder(item.path);
            revealInTree(item.path);
          } else {
            playFile(item);
            document.querySelectorAll(".file-row.selected").forEach(el => el.classList.remove("selected"));
            row.classList.add("selected");
          }
        });
        fileListEl.appendChild(row);
      });
    }catch(e){
      fileListEl.innerHTML = `<div class="status err">${friendlyError(e)}</div>`;
    }
  }

  function revealInTree(path){
    const row = treeRoot.querySelector(`.tree-item[data-path="${CSS.escape(path)}"]`);
    if (row){
      document.querySelectorAll(".tree-item.active").forEach(el => el.classList.remove("active"));
      row.classList.add("active");
    }
  }

  // ---------- player ----------
  const playerSlot = document.getElementById("player-slot");
  const nowTitle = document.getElementById("now-title");

  function setSpinning(on){
    spool.classList.toggle("spinning", on);
    spoolSmall.classList.toggle("spinning", on);
  }

  function playFile(item){
    nowTitle.textContent = item.name;
    nowTitle.classList.add("active");
    const k = kindOf(item.name);
    playerSlot.innerHTML = "";

    if (k === "audio"){
      const audio = document.createElement("audio");
      audio.controls = true;
      audio.src = item.download_url;
      audio.autoplay = true;
      audio.addEventListener("play", () => setSpinning(true));
      audio.addEventListener("pause", () => setSpinning(false));
      audio.addEventListener("ended", () => setSpinning(false));
      playerSlot.appendChild(audio);
    } else {
      const video = document.createElement("video");
      video.controls = true;
      video.src = item.download_url;
      video.autoplay = true;
      video.addEventListener("play", () => setSpinning(true));
      video.addEventListener("pause", () => setSpinning(false));
      video.addEventListener("ended", () => setSpinning(false));
      playerSlot.appendChild(video);
      if (k === "video-risky"){
        const warn = document.createElement("div");
        warn.className = "mkv-warning";
        warn.textContent = "This format isn't reliably supported by browsers. If it doesn't play, use the download icon next to the file instead.";
        playerSlot.appendChild(warn);
      }
    }
  }

  // ---------- boot ----------
  (async function init(){
    await buildTreeItem(CONFIG.ROOT, 0, treeRoot);
    const rootRow = treeRoot.querySelector(`.tree-item[data-path="${CSS.escape(CONFIG.ROOT)}"]`);
    if (rootRow) rootRow.click();
  })();
})();
</script>
</body>
</html>
